name: Release

# Builds a release APK and attaches it to a GitHub release when a v* tag is pushed.
# See docs/releasing.md for the signing secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      PETCHECK_KEYSTORE_BASE64: ${{ secrets.PETCHECK_KEYSTORE_BASE64 }}
      PETCHECK_KEYSTORE_PASSWORD: ${{ secrets.PETCHECK_KEYSTORE_PASSWORD }}
      PETCHECK_KEY_ALIAS: ${{ secrets.PETCHECK_KEY_ALIAS }}
      PETCHECK_KEY_PASSWORD: ${{ secrets.PETCHECK_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Add the Firebase configuration, if one is provided
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Require a private signing key
        if: env.PETCHECK_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::No signing key. A public release must not be signed with the shared debug key: add the secrets described in docs/releasing.md."
          exit 1
      - name: Prepare the signing key
        run: |
          printf '%s' "$PETCHECK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PETCHECK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "pet-check-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "pet-check-$GITHUB_REF_NAME.apk" --generate-notes
