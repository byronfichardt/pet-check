name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, screenshot tests, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pet-check-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-reports
          path: |
            app/build/outputs/screenshots
            app/build/reports

  device:
    name: Android ${{ matrix.android }} emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # An old phone and a current one.
          - android: "9"
            api-level: 28
            target: default
          - android: "14"
            api-level: 34
            target: aosp_atd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app and the real sound model on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          # Audio stays on: the tests open the microphone.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest
      - name: Check that the device tests really ran
        run: |
          # Result file names contain spaces, so let find hand them to grep directly.
          ran=$(find app/build/outputs/androidTest-results -name 'TEST-*.xml' \
            -exec grep -ho '<testsuite[^>]* tests="[0-9]*"' {} + \
            | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{ total += $1 } END { print total + 0 }')
          echo "Device tests run on Android ${{ matrix.android }}: $ran" | tee -a "$GITHUB_STEP_SUMMARY"
          # A build that silently runs no tests must not pass.
          test "$ran" -ge 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-android-${{ matrix.android }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results

  pi:
    name: Raspberry Pi monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
          pip install -e pi
      - name: Unit tests
        run: python -m unittest discover -s tests
        working-directory: pi

  firebase:
    name: Firebase rules and function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
          pip install -e pi
          npm ci --prefix firebase
      - name: Security rules against the Firestore emulator
        run: npm test
        working-directory: firebase
      - name: Pi monitor end to end against the emulators
        run: npm run test:pi
        working-directory: firebase
      - name: Cloud Function
        run: npm test
        working-directory: firebase/functions
